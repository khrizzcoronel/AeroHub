# Nota: ruff-format sustituye a black (formato compatible, un solo paso de
# formateo evita que dos herramientas se contradigan sobre el mismo archivo).
# El hook de eslint se añade cuando apps/web exista como proyecto Angular real
# (Sprint S1.1) — hoy no hay configuración de ESLint que ejecutar.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: ["sqlalchemy>=2.0", "pydantic>=2.0"]
        args: [--ignore-missing-imports]
        files: ^(packages|services|pipelines|db)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.19.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
