[project]
name = "aerohub_continuidad"
version = "0.1.0"
description = "Continuidad operacional RTO/RPO (ADR-018) -- snapshot, shipper, prueba de restauracion, conmutacion"
requires-python = ">=3.12"
dependencies = [
    "pymonetdb>=1.8",
    "boto3>=1.35",
    "prometheus-client>=0.20",
    "aerohub-kernel",
    "aerohub-repository",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_continuidad"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
aerohub-repository = { workspace = true }
