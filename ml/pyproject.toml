[project]
name = "aerohub-ml"
version = "0.1.0"
description = "Prediccion de demoras (D4): features, entrenamiento XGBoost+SHAP, MLOps (MLflow, Evidently)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "xgboost>=2.1",
    "shap>=0.46",
    "mlflow>=2.16",
    "evidently>=0.4",
    "numba>=0.60",
    "aerohub-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_ml"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
