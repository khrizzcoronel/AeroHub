name: CI

# Cadena de integración continua de AeroHub (Sprint S0.1/S0.2, Plan §7 / §6.4).
#
# Verifica en cada PR los controles que la arquitectura declara como puerta de
# release, no solo el estilo del código:
#   - ADR-017: reglas de dependencia entre capas y módulos (import-linter)
#   - Plan §6.1: convención de nomenclatura de DDL
#   - RF-T06 : SAST, dependencias, contenedores y secretos
#   - P1/PN-15: ningún módulo fuera de packages/repository emite SQL
#   - §6.4   : compuerta de pruebas — unitarias siempre; negativas (PN-*),
#              integración y suite cruzada (G4) corren contra un MonetDB
#              real de servicio, con la DDL y los seeds aplicados antes.
#              Los pasos que aún dependan de artefactos de sprints futuros
#              (p. ej. ClickHouse, OpenAPI) siguen condicionados a que el
#              archivo que los habilita ya exista.

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.11"

jobs:
  calidad-estatica:
    name: Lint · SAST · secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Bandit (SAST)
        run: uv run bandit -r services packages pipelines ml -ll
      - name: Gitleaks (secretos)
        uses: gitleaks/gitleaks-action@v2

  arquitectura:
    name: Reglas de arquitectura (ADR-017) · nomenclatura DDL (§6.1) · PN-15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --dev
      - name: Capas y módulos (ADR-017 §5.4)
        run: uv run lint-imports
      - name: Nomenclatura de DDL (Plan §6.1, cierra SDD-DATA-001 M-10)
        run: uv run python tools/lint_ddl_nomenclature.py
      - name: PN-15 — SQL fuera de packages/repository (P1, ADR-014)
        run: uv run pytest tests/negative/test_pn15_sql_fuera_del_repositorio.py -v

  contrato-api:
    name: OpenAPI 3.1 · Spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar si ya existe especificación que lintear (llega en S1.2)
        id: existe
        run: |
          if [ -f docs/api/openapi.yaml ]; then
            echo "spec=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existe.outputs.spec == 'true'
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.yaml --fail-severity=error

  contenedores:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  compuerta-de-pruebas:
    name: Unitarias · integración · negativas · cruzada (§6.4)
    runs-on: ubuntu-latest
    needs: [calidad-estatica, arquitectura]
    services:
      monetdb:
        image: monetdb/monetdb:latest
        ports: ["50000:50000"]
        env:
          MDB_CREATE_DBS: aerohub
          MDB_DB_ADMIN_PASS: aerohub
          MDB_DAEMON_PASS: aerohub
        options: >-
          --health-cmd "monetdb status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --dev

      - name: Unitarias (domain/ y packages/ sin infraestructura)
        run: uv run pytest tests/unit -v --cov --cov-report=term-missing

      - name: Aplicar DDL (db/ddl/monetdb/*.sql, en orden)
        run: uv run python -m db.migrations.apply --host localhost

      - name: Sembrar 2 tenants + filas canario (Plan §7.2)
        run: uv run python -m db.seeds.generate --host localhost

      - name: Integración (MonetDB real)
        run: uv run pytest tests/integration -v

      - name: Pruebas negativas PN-01…PN-15 (nuevas + regresión completa)
        run: uv run pytest tests/negative -v

      - name: Suite cruzada por tenant (ADR-019 G4)
        run: uv run pytest tests/cross_tenant -v

      - name: Archivar evidencia de la compuerta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ github.sha }}
          path: docs/evidencia/
          if-no-files-found: ignore
