# Entorno de desarrollo de AeroHub (Sprint S0.1, Plan §7.1).
#
# Motores conforme a ADR-012 (ClickHouse dual) y ADR-013 (MonetDB operacional).
# El servicio `monetdb-standby` no es opcional: es el componente C3 de ADR-018,
# sin el cual RNF-R01 no tiene mecanismo. MinIO aloja las capas medallion en
# Parquet y los snapshots de continuidad (ADR-018, C2).

services:
  monetdb:
    image: monetdb/monetdb:latest
    container_name: aerohub-monetdb
    environment:
      # MDB_CREATE_DBS controla que bases se crean AL INICIAR el contenedor
      # con `monetdb create -p "$MDB_DB_ADMIN_PASS"`. El default de la imagen
      # es solo "monetdb" (el nombre reservado de MonetDB) — sin listar aqui
      # "aerohub" explicitamente, esa base no se crea con esta contrasena.
      # Creado a mano con `monetdb create aerohub` (sin -p) hereda el password
      # historico por defecto del motor ('monetdb'), no MDB_DB_ADMIN_PASS —
      # discrepancia real encontrada y corregida en el Sprint S0.2.
      MDB_CREATE_DBS: aerohub
      MDB_DB_ADMIN_PASS: aerohub
      MDB_DAEMON_PASS: aerohub
    ports:
      - "50000:50000"
    volumes:
      - monetdata:/var/monetdb5/dbfarm
      # sys.hot_snapshot() (ADR-018 C2) escribe DENTRO del contenedor -- sin
      # este volumen compartido con continuidad-agente, el archivo resultante
      # seria inalcanzable para cualquier proceso fuera de este contenedor
      # (specs/011-continuidad-rto-rpo/research.md Decision 6).
      - snapshotstage:/snapshotstage
    healthcheck:
      test: ["CMD-SHELL", "monetdb status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  monetdb-standby:
    image: monetdb/monetdb:latest
    container_name: aerohub-monetdb-standby
    environment:
      MDB_CREATE_DBS: aerohub
      MDB_DB_ADMIN_PASS: aerohub
      MDB_DAEMON_PASS: aerohub
    ports:
      - "50001:50000"
    volumes:
      - monetdata-standby:/var/monetdb5/dbfarm
    healthcheck:
      test: ["CMD-SHELL", "monetdb status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Dedicado EXCLUSIVAMENTE a la prueba de restauracion semanal (ADR-018 C4;
  # specs/011-continuidad-rto-rpo/research.md Decision 5) -- separado del
  # standby real para no mezclar el proposito de C3 (replica que debe
  # reflejar el estado real para un failover real) con el de C4 (recuperacion
  # desde cero sobre datos sinteticos). Estatico, igual que monetdb-standby,
  # en vez de un contenedor efimero via socket de Docker (menor superficie
  # de privilegio).
  monetdb-restore-test:
    image: monetdb/monetdb:latest
    container_name: aerohub-monetdb-restore-test
    environment:
      MDB_CREATE_DBS: aerohub
      MDB_DB_ADMIN_PASS: aerohub
      MDB_DAEMON_PASS: aerohub
    ports:
      - "50002:50000"
    volumes:
      - monetdata-restore-test:/var/monetdb5/dbfarm
    healthcheck:
      test: ["CMD-SHELL", "monetdb status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aerohub-clickhouse
    environment:
      CLICKHOUSE_USER: aerohub
      CLICKHOUSE_PASSWORD: aerohub
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: aerohub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aerohub
      MINIO_ROOT_PASSWORD: aerohub123
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    image: apache/airflow:2.9.3
    container_name: aerohub-airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Sin backend Postgres propio, `standalone` solo soporta su SQLite por
      # defecto con SequentialExecutor (un DAG a la vez). Suficiente para
      # S0.1, donde aun no existe ningun DAG bajo pipelines/dags. Revisar en
      # S2.1 (Plan §9.1): si el volumen de DAGs exige paralelismo real,
      # anadir aqui un servicio Postgres dedicado al metastore de Airflow
      # (backend interno de Airflow, ortogonal a ADR-013 — MonetDB sigue
      # siendo el unico motor operacional de negocio) y fijar LocalExecutor.
    ports:
      - "8080:8080"
    volumes:
      - ../pipelines/dags:/opt/airflow/dags:ro
      - airflowdata:/opt/airflow
    depends_on:
      monetdb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: aerohub-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:latest
    container_name: aerohub-loki
    ports:
      - "3100:3100"
    # Sin healthcheck declarativo: la imagen no trae shell ni wget/curl (solo
    # el binario de Loki), por lo que un healthcheck CMD-SHELL no es viable
    # sin cambiar de imagen. Verificado manualmente vía `curl localhost:3100/ready`
    # desde el host (Plan §7.1, Sprint S0.1).

  grafana:
    image: grafana/grafana:latest
    container_name: aerohub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # API compuesta (Sprint S1.1-S1.5) y frontends Angular. Antes se corrian
  # sueltos en el host (`uv run uvicorn` / `npx nx serve`) -- a partir de
  # aqui, TODO servicio que se use corre en Docker, sin excepcion (pedido
  # explicito del usuario). `build.context: ..` porque tanto el gateway
  # (compone routers de varios paquetes del workspace uv) como los
  # frontends (monorepo Nx) necesitan archivos de la raiz del repo, no
  # solo su propia carpeta.
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: aerohub-gateway
    environment:
      # Host interno de la red default de Compose -- no "localhost" (ese
      # apuntaria al propio contenedor del gateway, no a MonetDB). El
      # default de aerohub_repository.base sigue siendo localhost:50000,
      # correcto para cuando el gateway corre suelto en el host.
      AEROHUB_DB_DSN: "monetdb://aerohub_app:aerohub_app_dev_password@monetdb:50000/aerohub"
      AEROHUB_JWT_SECRET: "aerohub-dev-secret-nunca-usar-en-produccion"
    ports:
      - "8000:8000"
    depends_on:
      monetdb:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: aerohub-web
    ports:
      - "4200:4200"
    depends_on:
      - gateway

  fids-player:
    build:
      context: ..
      dockerfile: apps/fids-player/Dockerfile
    container_name: aerohub-fids-player
    ports:
      - "4300:4300"
    depends_on:
      - gateway

  # Proceso continuo de continuidad operacional (Sprint S1.9, ADR-018):
  # snapshot programado (C2), shipper (C3) y prueba de restauracion semanal
  # (C4) como tareas asincronas concurrentes -- mismo patron que la tarea de
  # fondo del monitor de senal FIDS en services/gateway/main.py, no DAGs de
  # Airflow (specs/011-continuidad-rto-rpo/research.md Decision 4).
  continuidad-agente:
    build:
      context: ..
      dockerfile: packages/continuidad/Dockerfile
    container_name: aerohub-continuidad-agente
    environment:
      AEROHUB_DB_DSN: "monetdb://aerohub_app:aerohub_app_dev_password@monetdb:50000/aerohub"
      AEROHUB_STANDBY_HOST: monetdb-standby
      AEROHUB_STANDBY_PORT: "50000"
      AEROHUB_STANDBY_DATABASE: aerohub
      AEROHUB_STANDBY_USERNAME: monetdb
      AEROHUB_STANDBY_PASSWORD: aerohub
      AEROHUB_RESTORE_TEST_HOST: monetdb-restore-test
      AEROHUB_RESTORE_TEST_PORT: "50000"
      AEROHUB_RESTORE_TEST_DATABASE: aerohub
      AEROHUB_RESTORE_TEST_USERNAME: monetdb
      AEROHUB_RESTORE_TEST_PASSWORD: aerohub
      AEROHUB_PRIMARY_HOST: monetdb
      AEROHUB_PRIMARY_PORT: "50000"
      AEROHUB_PRIMARY_DATABASE: aerohub
      AEROHUB_PRIMARY_USERNAME: monetdb
      AEROHUB_PRIMARY_PASSWORD: aerohub
      AEROHUB_SNAPSHOT_PATH: /snapshotstage
      AEROHUB_MINIO_ENDPOINT: "http://minio:9000"
      AEROHUB_MINIO_ACCESS_KEY: aerohub
      AEROHUB_MINIO_SECRET_KEY: aerohub123
      AEROHUB_MINIO_BUCKET: aerohub-continuidad
      AEROHUB_METRICS_PORT: "9101"
    ports:
      - "9101:9101"
    volumes:
      - snapshotstage:/snapshotstage
    depends_on:
      monetdb:
        condition: service_healthy
      monetdb-standby:
        condition: service_healthy
      monetdb-restore-test:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  monetdata:
  monetdata-standby:
  monetdata-restore-test:
  chdata:
  miniodata:
  airflowdata:
  snapshotstage:
