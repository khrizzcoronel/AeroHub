# Entorno de desarrollo de AeroHub (Sprint S0.1, Plan §7.1).
#
# Motores conforme a ADR-012 (ClickHouse dual) y ADR-013 (MonetDB operacional).
# El servicio `monetdb-standby` no es opcional: es el componente C3 de ADR-018,
# sin el cual RNF-R01 no tiene mecanismo. MinIO aloja las capas medallion en
# Parquet y los snapshots de continuidad (ADR-018, C2).

services:
  monetdb:
    image: monetdb/monetdb:latest
    container_name: aerohub-monetdb
    environment:
      MDB_DB_ADMIN_PASS: aerohub
      MDB_DAEMON_PASS: aerohub
    ports:
      - "50000:50000"
    volumes:
      - monetdata:/var/monetdb5/dbfarm
    healthcheck:
      test: ["CMD-SHELL", "monetdb status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  monetdb-standby:
    image: monetdb/monetdb:latest
    container_name: aerohub-monetdb-standby
    environment:
      MDB_DB_ADMIN_PASS: aerohub
      MDB_DAEMON_PASS: aerohub
    ports:
      - "50001:50000"
    volumes:
      - monetdata-standby:/var/monetdb5/dbfarm
    healthcheck:
      test: ["CMD-SHELL", "monetdb status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aerohub-clickhouse
    environment:
      CLICKHOUSE_USER: aerohub
      CLICKHOUSE_PASSWORD: aerohub
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: aerohub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aerohub
      MINIO_ROOT_PASSWORD: aerohub123
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    image: apache/airflow:2.9.3
    container_name: aerohub-airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Sin backend Postgres propio, `standalone` solo soporta su SQLite por
      # defecto con SequentialExecutor (un DAG a la vez). Suficiente para
      # S0.1, donde aun no existe ningun DAG bajo pipelines/dags. Revisar en
      # S2.1 (Plan §9.1): si el volumen de DAGs exige paralelismo real,
      # anadir aqui un servicio Postgres dedicado al metastore de Airflow
      # (backend interno de Airflow, ortogonal a ADR-013 — MonetDB sigue
      # siendo el unico motor operacional de negocio) y fijar LocalExecutor.
    ports:
      - "8080:8080"
    volumes:
      - ../pipelines/dags:/opt/airflow/dags:ro
      - airflowdata:/opt/airflow
    depends_on:
      monetdb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: aerohub-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:latest
    container_name: aerohub-loki
    ports:
      - "3100:3100"
    # Sin healthcheck declarativo: la imagen no trae shell ni wget/curl (solo
    # el binario de Loki), por lo que un healthcheck CMD-SHELL no es viable
    # sin cambiar de imagen. Verificado manualmente vía `curl localhost:3100/ready`
    # desde el host (Plan §7.1, Sprint S0.1).

  grafana:
    image: grafana/grafana:latest
    container_name: aerohub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  monetdata:
  monetdata-standby:
  chdata:
  miniodata:
  airflowdata:
