[project]
name = "aerohub-pipelines"
version = "0.1.0"
description = "Orquestacion Airflow del pipeline medallion (D4, ADR-015): dags, contratos de datos, transformaciones y reconciliacion"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=2.9",
    "great-expectations>=1.1",
    "polars>=1.9",
    "aerohub-kernel",
    "aerohub-repository",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_pipelines"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
aerohub-repository = { workspace = true }
