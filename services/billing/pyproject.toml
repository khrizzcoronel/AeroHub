[project]
name = "aerohub_billing"
version = "0.1.0"
description = "M5 — Revenue & Billing — departamento D3 — esquema billing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "aerohub-kernel",
    "aerohub-contracts",
    "aerohub-repository",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_billing"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
aerohub-contracts = { workspace = true }
aerohub-repository = { workspace = true }
