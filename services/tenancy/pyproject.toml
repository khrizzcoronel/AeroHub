[project]
name = "aerohub_tenancy"
version = "0.1.0"
description = "Aprovisionamiento y licencias — departamento D5 — esquema tenants"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "aerohub-kernel",
    "aerohub-contracts",
    "aerohub-repository",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_tenancy"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
aerohub-contracts = { workspace = true }
aerohub-repository = { workspace = true }
