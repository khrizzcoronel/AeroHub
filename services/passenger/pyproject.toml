[project]
name = "aerohub_passenger"
version = "0.1.0"
description = "M6 — Passenger Experience — departamento D1 — esquema billing.tiempo_espera_agregado"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "aerohub-kernel",
    "aerohub-contracts",
    "aerohub-repository",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_passenger"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
aerohub-contracts = { workspace = true }
aerohub-repository = { workspace = true }
