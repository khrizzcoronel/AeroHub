[project]
name = "aerohub_support"
version = "0.1.0"
description = "Soporte y documentacion — departamento D6 — esquema support"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "aerohub-kernel",
    "aerohub-contracts",
    "aerohub-repository",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerohub_support"]

[tool.uv.sources]
aerohub-kernel = { workspace = true }
aerohub-contracts = { workspace = true }
aerohub-repository = { workspace = true }
