<div class="stage-simple">
  <form class="card" (ngSubmit)="enviar()">
    <h1>Invitar a alguien de tu organizacion</h1>
    <p class="card__sub">Le enviamos un enlace por correo para que active su cuenta.</p>

    <label class="field">
      <span class="field__label">Correo</span>
      <input
        type="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
      />
    </label>

    <label class="field">
      <span class="field__label">Rol</span>
      <select [ngModel]="rolCodigo()" (ngModelChange)="rolCodigo.set($event)" name="rolCodigo">
        <option value="role_operations_controller">Control de operaciones</option>
        <option value="role_airline_coordinator">Coordinacion de aerolinea</option>
        <option value="role_ramp_agent">Agente de rampa</option>
        <option value="role_billing_officer">Facturacion</option>
        <option value="role_tenant_analyst">Analista</option>
      </select>
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    @if (invitacionId()) {
      <p class="notice">Invitacion enviada.</p>
    }

    <button type="submit" class="btn" [disabled]="enviando()">
      {{ enviando() ? 'Enviando...' : 'Enviar invitacion' }}
    </button>
  </form>
</div>
