<form class="formulario" (ngSubmit)="enviar()">
  <p class="invitar__descripcion">Le enviamos un enlace por correo para que active su cuenta.</p>

  <div class="ah-campo">
    <label class="ah-campo__etiqueta" for="invitarEmail">Correo</label>
    <input
      id="invitarEmail"
      type="email"
      required
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      name="email"
    />
  </div>

  <div class="ah-campo">
    <label class="ah-campo__etiqueta" for="invitarRol">Rol</label>
    <select id="invitarRol" [ngModel]="rolCodigo()" (ngModelChange)="rolCodigo.set($event)" name="rolCodigo">
      <option value="role_operations_controller">Control de operaciones</option>
      <option value="role_airline_coordinator">Coordinación de aerolínea</option>
      <option value="role_ramp_agent">Agente de rampa</option>
      <option value="role_billing_officer">Facturación</option>
      <option value="role_tenant_analyst">Analista</option>
    </select>
  </div>

  @if (error()) {
    <p class="ah-alerta" role="alert">{{ error() }}</p>
  }

  <div class="modal-acciones">
    <button type="submit" class="ah-btn" [disabled]="enviando()">
      {{ enviando() ? 'Enviando...' : 'Enviar invitación' }}
    </button>
    <button type="button" class="ah-btn ah-btn--secundario" (click)="cerrar.emit()">Cancelar</button>
  </div>
</form>
