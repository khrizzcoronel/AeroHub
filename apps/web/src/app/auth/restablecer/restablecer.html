<div class="stage-simple">
  @if (!listo()) {
    <form class="card" (ngSubmit)="enviar()">
      <h1>Elegir contrasena nueva</h1>

      <label class="field">
        <span class="field__label">Contrasena nueva</span>
        <input
          type="password"
          required
          autocomplete="new-password"
          [ngModel]="passwordNueva()"
          (ngModelChange)="passwordNueva.set($event)"
          name="passwordNueva"
        />
        <span class="field__hint">Al menos 10 caracteres, con letras y numeros.</span>
      </label>

      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn" [disabled]="enviando()">
        {{ enviando() ? 'Guardando...' : 'Restablecer contrasena' }}
      </button>
    </form>
  } @else {
    <div class="card">
      <h1>Contrasena restablecida</h1>
      <p class="notice">Ya podes iniciar sesion con tu contrasena nueva.</p>
      <button type="button" class="btn" (click)="irAlLogin()">Ir a iniciar sesion</button>
    </div>
  }
</div>
