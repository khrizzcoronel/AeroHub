<div class="stage-simple">
  <form class="card" (ngSubmit)="enviar()">
    <h1>Elegi una contrasena nueva</h1>
    <p class="card__sub">
      Tu contrasena actual es temporal. Elegi una propia antes de continuar.
    </p>

    <label class="field">
      <span class="field__label">Contrasena temporal</span>
      <input
        type="password"
        required
        autocomplete="current-password"
        [ngModel]="passwordActual()"
        (ngModelChange)="passwordActual.set($event)"
        name="passwordActual"
      />
    </label>

    <label class="field">
      <span class="field__label">Contrasena nueva</span>
      <input
        type="password"
        required
        autocomplete="new-password"
        [ngModel]="passwordNueva()"
        (ngModelChange)="passwordNueva.set($event)"
        name="passwordNueva"
      />
      <span class="field__hint">Al menos 10 caracteres, con letras y numeros.</span>
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn" [disabled]="enviando()">
      {{ enviando() ? 'Guardando...' : 'Guardar y continuar' }}
    </button>
  </form>
</div>
