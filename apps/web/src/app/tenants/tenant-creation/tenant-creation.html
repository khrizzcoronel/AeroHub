<h2>Aprovisionar tenant (CU-O18)</h2>

@if (resultado(); as r) {
  <div class="ah-alerta ah-alerta--aviso resultado">
    <p class="resultado__titulo">Tenant creado.</p>
    <dl class="resultado__lista">
      <dt>tenant_id</dt>
      <dd>{{ r.tenant_id }}</dd>
      <dt>usuario_admin_id</dt>
      <dd>{{ r.usuario_admin_id }}</dd>
      <dt>password_temporal</dt>
      <dd>{{ r.password_temporal }}</dd>
    </dl>
  </div>
  <button type="button" class="ah-btn" (click)="cerrar.emit()">Cerrar</button>
} @else {
  <form class="formulario" (ngSubmit)="enviar()">
    <div class="ah-campo">
      <label class="ah-campo__etiqueta" for="codigo">Codigo</label>
      <input
        id="codigo"
        type="text"
        required
        [ngModel]="codigo()"
        (ngModelChange)="codigo.set($event)"
        name="codigo"
      />
    </div>

    <div class="ah-campo">
      <label class="ah-campo__etiqueta" for="razonSocial">Razon social</label>
      <input
        id="razonSocial"
        type="text"
        required
        [ngModel]="razonSocial()"
        (ngModelChange)="razonSocial.set($event)"
        name="razonSocial"
      />
    </div>

    <div class="ah-campo">
      <label class="ah-campo__etiqueta" for="aeropuertoId">Aeropuerto</label>
      <select
        id="aeropuertoId"
        required
        [ngModel]="aeropuertoId()"
        (ngModelChange)="aeropuertoId.set($event)"
        name="aeropuertoId"
      >
        <option value="" disabled selected>Seleccionar aeropuerto</option>
        @for (a of aeropuertos(); track a.id) {
          <option [value]="a.id">{{ a.codigo_iata }} &ndash; {{ a.nombre }}</option>
        }
      </select>
    </div>

    <div class="ah-campo">
      <label class="ah-campo__etiqueta" for="planId">Plan</label>
      <select
        id="planId"
        required
        [ngModel]="planId()"
        (ngModelChange)="planId.set($event)"
        name="planId"
      >
        <option value="" disabled selected>Seleccionar plan</option>
        @for (p of planes(); track p.id) {
          <option [value]="p.id">{{ p.nombre }} ({{ p.codigo }})</option>
        }
      </select>
    </div>

    <div class="ah-campo">
      <label class="ah-campo__etiqueta" for="emailAdmin">Email del administrador</label>
      <input
        id="emailAdmin"
        type="email"
        required
        [ngModel]="emailAdmin()"
        (ngModelChange)="emailAdmin.set($event)"
        name="emailAdmin"
      />
    </div>

    <div class="ah-campo">
      <label class="ah-campo__etiqueta" for="nombreAdmin">Nombre del administrador</label>
      <input
        id="nombreAdmin"
        type="text"
        required
        [ngModel]="nombreAdmin()"
        (ngModelChange)="nombreAdmin.set($event)"
        name="nombreAdmin"
      />
    </div>

    @if (error()) {
      <p class="ah-alerta" role="alert">{{ error() }}</p>
    }

    <div class="modal-acciones">
      <button type="submit" class="ah-btn" [disabled]="enviando()">
        {{ enviando() ? 'Enviando...' : 'Crear tenant' }}
      </button>
      <button type="button" class="ah-btn ah-btn--secundario" (click)="cerrar.emit()">Cancelar</button>
    </div>
  </form>
}
