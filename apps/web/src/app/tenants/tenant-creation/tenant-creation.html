<h1>Aprovisionar tenant (CU-O18)</h1>

<form (ngSubmit)="enviar()">
  <div>
    <label for="codigo">Codigo</label>
    <input
      id="codigo"
      type="text"
      required
      [ngModel]="codigo()"
      (ngModelChange)="codigo.set($event)"
      name="codigo"
    />
  </div>

  <div>
    <label for="razonSocial">Razon social</label>
    <input
      id="razonSocial"
      type="text"
      required
      [ngModel]="razonSocial()"
      (ngModelChange)="razonSocial.set($event)"
      name="razonSocial"
    />
  </div>

  <div>
    <label for="aeropuertoId">Aeropuerto id</label>
    <input
      id="aeropuertoId"
      type="text"
      inputmode="numeric"
      pattern="[0-9]+"
      required
      [ngModel]="aeropuertoId()"
      (ngModelChange)="aeropuertoId.set($event)"
      name="aeropuertoId"
    />
  </div>

  <div>
    <label for="planId">Plan id</label>
    <input
      id="planId"
      type="text"
      inputmode="numeric"
      pattern="[0-9]+"
      required
      [ngModel]="planId()"
      (ngModelChange)="planId.set($event)"
      name="planId"
    />
  </div>

  <div>
    <label for="emailAdmin">Email del administrador</label>
    <input
      id="emailAdmin"
      type="email"
      required
      [ngModel]="emailAdmin()"
      (ngModelChange)="emailAdmin.set($event)"
      name="emailAdmin"
    />
  </div>

  <div>
    <label for="nombreAdmin">Nombre del administrador</label>
    <input
      id="nombreAdmin"
      type="text"
      required
      [ngModel]="nombreAdmin()"
      (ngModelChange)="nombreAdmin.set($event)"
      name="nombreAdmin"
    />
  </div>

  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Enviando...' : 'Crear tenant' }}
  </button>
</form>

@if (error()) {
  <p role="alert">Error: {{ error() }}</p>
}

@if (resultado(); as r) {
  <div>
    <p>Tenant creado.</p>
    <ul>
      <li>tenant_id: {{ r.tenant_id }}</li>
      <li>usuario_admin_id: {{ r.usuario_admin_id }}</li>
      <li>password_temporal: {{ r.password_temporal }}</li>
    </ul>
  </div>
}
