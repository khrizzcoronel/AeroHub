openapi: 3.1.0
info:
  title: AeroHub API
  description: 'API operacional de AeroHub: aprovisionamiento de tenants, seguimiento
    de vuelos y distribucion de FIDS en tiempo real (RF-T02, OpenAPI 3.1).'
  contact:
    name: AeroHub Platform Team
  version: 0.1.0
servers:
- url: http://localhost:8000
  description: Desarrollo local
paths:
  /tenants:
    get:
      tags:
      - tenants
      summary: Listar Tenants Endpoint
      description: 'Workpanel: lista de todos los tenants (alcance ''interno'', no
        hay

        filtro de tenant que aplicar -- ver consultas_tenant.py).'
      operationId: listar_tenants_endpoint_tenants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TenantResumenResponse'
                type: array
                title: Response Listar Tenants Endpoint Tenants Get
    post:
      tags:
      - tenants
      summary: Crear Tenant
      description: Aprovisiona un tenant nuevo con su usuario administrador (CU-O18).
      operationId: crear_tenant_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCrearRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCrearResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /catalogo/aeropuertos:
    get:
      tags:
      - tenants
      summary: Listar Aeropuertos Endpoint
      description: 'Para el select de aeropuerto del formulario de tenant -- antes
        se

        pedia el id de memoria en un campo de texto libre.'
      operationId: listar_aeropuertos_endpoint_catalogo_aeropuertos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AeropuertoResponse'
                type: array
                title: Response Listar Aeropuertos Endpoint Catalogo Aeropuertos Get
  /catalogo/planes:
    get:
      tags:
      - tenants
      summary: Listar Planes Endpoint
      operationId: listar_planes_endpoint_catalogo_planes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlanResponse'
                type: array
                title: Response Listar Planes Endpoint Catalogo Planes Get
  /tenants/validar:
    get:
      tags:
      - tenants
      summary: Validar Disponibilidad Endpoint
      description: Verifica en tiempo real si un codigo de tenant o email de admin
        ya existen.
      operationId: validar_disponibilidad_endpoint_tenants_validar_get
      parameters:
      - name: codigo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Codigo
      - name: email_admin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Email Admin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidarDisponibilidadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tenants/{tenant_id}:
    get:
      tags:
      - tenants
      summary: Obtener Tenant Endpoint
      operationId: obtener_tenant_endpoint_tenants__tenant_id__get
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: integer
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResumenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - tenants
      summary: Actualizar Tenant Endpoint
      operationId: actualizar_tenant_endpoint_tenants__tenant_id__patch
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: integer
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantActualizarRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResumenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - tenants
      summary: Eliminar Tenant Endpoint
      description: Borrado fisico permanente de un tenant y todos sus registros asociados.
      operationId: eliminar_tenant_endpoint_tenants__tenant_id__delete
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: integer
          title: Tenant Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tenants/{tenant_id}/estado:
    post:
      tags:
      - tenants
      summary: Cambiar Estado Tenant Endpoint
      description: 'Transiciones validas por domain/tenant.py -- p. ej. dar de baja
        es

        terminal, no se puede reactivar un tenant ''dado_de_baja''.'
      operationId: cambiar_estado_tenant_endpoint_tenants__tenant_id__estado_post
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: integer
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCambiarEstadoRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResumenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api-keys:
    get:
      tags:
      - tenants
      summary: Listar Api Keys Endpoint
      description: Lista las API Keys asociadas al tenant del usuario autenticado.
      operationId: listar_api_keys_endpoint_api_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyResumenResponse'
                type: array
                title: Response Listar Api Keys Endpoint Api Keys Get
    post:
      tags:
      - tenants
      summary: Crear Api Key Endpoint
      description: 'Genera una API Key nueva para el tenant del llamador (RF-O12).


        El secreto en claro se devuelve UNA sola vez -- no se puede recuperar

        despues, solo revocar y crear una nueva.'
      operationId: crear_api_key_endpoint_api_keys_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCrearResponse'
  /licencias/mi-tenant:
    get:
      tags:
      - tenants
      summary: Listar Licencias Mi Tenant Endpoint
      description: Lista las licencias contratadas por el tenant del usuario autenticado.
      operationId: listar_licencias_mi_tenant_endpoint_licencias_mi_tenant_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LicenciaResumenResponse'
                type: array
                title: Response Listar Licencias Mi Tenant Endpoint Licencias Mi Tenant
                  Get
  /api-keys/{api_key_id}/revocar:
    post:
      tags:
      - tenants
      summary: Revocar Api Key Endpoint
      description: 'Revoca una API Key del propio tenant (PN-06: deja de aceptarse
        de inmediato).'
      operationId: revocar_api_key_endpoint_api_keys__api_key_id__revocar_post
      parameters:
      - name: api_key_id
        in: path
        required: true
        schema:
          type: integer
          title: Api Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api-keys/{api_key_id}/rotar:
    post:
      tags:
      - tenants
      summary: Rotar Api Key Endpoint
      description: 'RF-O12 -- emite un secreto nuevo sin interrumpir el servicio:
        la

        key anterior queda revocada (con `rotada_en`), la nueva es la

        credencial activa desde ahora. Evento auditado (SC-004).'
      operationId: rotar_api_key_endpoint_api_keys__api_key_id__rotar_post
      parameters:
      - name: api_key_id
        in: path
        required: true
        schema:
          type: integer
          title: Api Key Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCrearResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'FR-001..FR-004: nunca distingue en la respuesta si fallo el correo

        o la contrasena -- un solo 401 para todos los casos de credencial

        invalida, cuenta inactiva, bloqueada o sin rol vigente.'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/yo:
    get:
      tags:
      - auth
      summary: Obtener Mi Perfil
      operationId: obtener_mi_perfil_auth_yo_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Logout Auth Logout Post
  /auth/cambiar-password:
    post:
      tags:
      - auth
      summary: Cambiar Mi Password
      operationId: cambiar_mi_password_auth_cambiar_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Cambiar Mi Password Auth Cambiar Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/recuperar:
    post:
      tags:
      - auth
      summary: Recuperar Password
      description: 'FR-021: SIEMPRE 202, exista o no la cuenta -- no se puede usar

        para descubrir que correos estan registrados.'
      operationId: recuperar_password_auth_recuperar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Recuperar Password Auth Recuperar Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/restablecer:
    post:
      tags:
      - auth
      summary: Restablecer Mi Password
      operationId: restablecer_mi_password_auth_restablecer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Restablecer Mi Password Auth Restablecer Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/verificar-correo:
    post:
      tags:
      - auth
      summary: Verificar Mi Correo
      operationId: verificar_mi_correo_auth_verificar_correo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarCorreoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Verificar Mi Correo Auth Verificar Correo Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/solicitar-verificacion:
    post:
      tags:
      - auth
      summary: Pedir Verificacion De Correo
      operationId: pedir_verificacion_de_correo_auth_solicitar_verificacion_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Pedir Verificacion De Correo Auth Solicitar Verificacion
                  Post
  /usuarios/invitaciones:
    post:
      tags:
      - auth
      summary: Invitar
      operationId: invitar_usuarios_invitaciones_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitarRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitarResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /usuarios/aceptar-invitacion:
    post:
      tags:
      - auth
      summary: Aceptar
      operationId: aceptar_usuarios_aceptar_invitacion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceptarInvitacionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceptarInvitacionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /usuarios:
    get:
      tags:
      - auth
      summary: Listar Usuarios
      operationId: listar_usuarios_usuarios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UsuarioResumenResponse'
                type: array
                title: Response Listar Usuarios Usuarios Get
  /usuarios/{usuario_id}:
    get:
      tags:
      - auth
      summary: Obtener Usuario Endpoint
      operationId: obtener_usuario_endpoint_usuarios__usuario_id__get
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: integer
          title: Usuario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDetalleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - auth
      summary: Actualizar Usuario Endpoint
      operationId: actualizar_usuario_endpoint_usuarios__usuario_id__patch
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: integer
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizarRolRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDetalleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /usuarios/{usuario_id}/estado:
    post:
      tags:
      - auth
      summary: Cambiar Estado Usuario Endpoint
      operationId: cambiar_estado_usuario_endpoint_usuarios__usuario_id__estado_post
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: integer
          title: Usuario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCambiarEstadoRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDetalleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vuelos/catalogo/aerolineas:
    get:
      tags:
      - vuelos
      summary: Listar Aerolineas Endpoint
      description: 'Catalogo global para el select de aerolinea del formulario de
        alta

        de vuelo -- sin esto, el formulario pediria un id Snowflake a mano

        (Sprint S1.15, FR-010).'
      operationId: listar_aerolineas_endpoint_vuelos_catalogo_aerolineas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AerolineaResponse'
                type: array
                title: Response Listar Aerolineas Endpoint Vuelos Catalogo Aerolineas
                  Get
  /vuelos/catalogo/aeronaves:
    get:
      tags:
      - vuelos
      summary: Listar Aeronaves Endpoint
      operationId: listar_aeronaves_endpoint_vuelos_catalogo_aeronaves_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AeronaveResponse'
                type: array
                title: Response Listar Aeronaves Endpoint Vuelos Catalogo Aeronaves
                  Get
  /vuelos/catalogo/tipos-vuelo:
    get:
      tags:
      - vuelos
      summary: Listar Tipos Vuelo Endpoint
      operationId: listar_tipos_vuelo_endpoint_vuelos_catalogo_tipos_vuelo_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TipoVueloResponse'
                type: array
                title: Response Listar Tipos Vuelo Endpoint Vuelos Catalogo Tipos
                  Vuelo Get
  /vuelos:
    post:
      tags:
      - vuelos
      summary: Crear Vuelo
      description: Da de alta un vuelo para el tenant del llamador (RF-O02 parcial).
      operationId: crear_vuelo_vuelos_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VueloCrearRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VueloCrearResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vuelos/{vuelo_id}:
    get:
      tags:
      - vuelos
      summary: Obtener Vuelo
      description: 'Consulta un vuelo por id (PN-01: 404 si es de otro tenant).'
      operationId: obtener_vuelo_vuelos__vuelo_id__get
      parameters:
      - name: vuelo_id
        in: path
        required: true
        schema:
          type: integer
          title: Vuelo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VueloConsultaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vuelos/{vuelo_id}/estados:
    post:
      tags:
      - vuelos
      summary: Cambiar Estado Vuelo
      description: 'Registra un cambio de estado y lo publica en el canal en tiempo

        real /vuelos/ws/estado (RF-O04, RNF-P01).'
      operationId: cambiar_estado_vuelo_vuelos__vuelo_id__estados_post
      parameters:
      - name: vuelo_id
        in: path
        required: true
        schema:
          type: integer
          title: Vuelo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioEstadoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fids/plantillas:
    post:
      tags:
      - fids
      summary: Publicar Plantilla Endpoint
      description: Publica una version nueva de plantilla FIDS (RF-T03).
      operationId: publicar_plantilla_endpoint_fids_plantillas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantillaPublicarRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantillaPublicarResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fids/pantallas:
    post:
      tags:
      - fids
      summary: Registrar Pantalla Endpoint
      description: Registra una pantalla fisica nueva (RF-O07).
      operationId: registrar_pantalla_endpoint_fids_pantallas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantallaRegistrarRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantallaRegistrarResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fids/pantallas/{pantalla_id}/plantilla:
    patch:
      tags:
      - fids
      summary: Asignar Plantilla Endpoint
      description: 'Cambia la plantilla vigente de una pantalla (RF-T03, RNF-P02:
        <1s).'
      operationId: asignar_plantilla_endpoint_fids_pantallas__pantalla_id__plantilla_patch
      parameters:
      - name: pantalla_id
        in: path
        required: true
        schema:
          type: integer
          title: Pantalla Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarPlantillaRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fids/pantallas/{pantalla_id}/heartbeat:
    post:
      tags:
      - fids
      summary: Heartbeat Endpoint
