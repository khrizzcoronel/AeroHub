tags:
- name: auth
  description: Login, sesion, perfil de acceso, invitaciones y ciclo de vida de la
    credencial.
- name: tenants
  description: Aprovisionamiento de tenants y gestion de API Keys.
- name: vuelos
  description: Alta, consulta y cambio de estado de vuelos (AODB).
- name: fids
  description: Plantillas y pantallas FIDS, publicacion en tiempo real.
- name: puertas
  description: Asignacion de puertas, manual y automatica (PuLP).
- name: rampa
  description: Turnaround, tareas de rampa e incidencias por desviacion.
- name: facturacion
  description: Tarifarios, motor de facturacion, facturas y conciliacion de pasajeros.
- name: experiencia-pasajero
  description: Estimacion agregada de tiempos de espera por terminal, sin PII.
- name: compliance
  description: Incidentes de seguridad, post-mortems, reportes regulatorios y evidencia
    SOC 2.
- name: soporte
  description: Tickets con SLA, base de conocimientos, changelog y uptime/error budget.
